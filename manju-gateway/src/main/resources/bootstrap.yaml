spring:
  application:
    name: gateway-service #服务名
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848 #nacos地址
      config:
        file-extension: yaml
    gateway:
      routes:
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/auth/**
        - id: agent
          uri: lb://agent-service
          predicates:
            - Path=/generate/**,/session/**,/chat/**,/embedding/**,/agent/**
        - id: task
          uri: lb://task-service
          predicates:
            - Path=/task/**
        - id: media
          uri: lb://media-service
          predicates:
            - Path=/media/**
        - id: work
          uri: lb://work-service
          predicates:
            - Path=/comicDrama/**
  config:
    import: #导入nacos配置
      - nacos:shared-log.yaml