spring:
  application:
    name: gateway-service #服务名
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848 #nacos地址
      config:
        file-extension: yaml
    gateway:
      routes:
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/auth/**
  config:
    import: #导入nacos配置
      - nacos:shared-log.yaml