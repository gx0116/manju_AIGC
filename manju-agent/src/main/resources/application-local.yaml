mj:
  db:
    host: 192.168.100.128 # 修改虚拟机IP地址
    port: 3306
    database: mj_agent
    un: root
    pw: 123456 # 修改为docker中的MySQL密码
  redis:
    host: 192.168.100.128 # 修改虚拟机IP地址
    port: 6379
    password: 123456
    database: 0
  ai:
    prompt:
      system:
        chat:
          data-id: system-chat--message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000

# ========== DashScope 图像生成配置 ==========
# 默认 wanx-v1 是异步模型（需轮询等待），易超时报 "Image generation still pending"
# 改用 qwen-image 同步模型，直接返回图片 URL，无需轮询
spring:
  ai:
    dashscope:
      image:
        options:
          model: qwen-image